<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - BizTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-4 text-center">
                <div class="mb-3">
                    <span class="badge bg-warning text-dark p-3 rounded-circle mb-2 fs-3">
                        <i class="bi bi-gem"></i>
                    </span>
                    <h4 class="fw-bold text-dark mb-0">BizTrack</h4>
                    <small class="text-muted">Sign in to your business dashboard</small>
                </div>

                {% if error %}
                    <div class="alert alert-danger py-2 small rounded-3" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="text-start mb-4">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="text-start mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required placeholder="Enter password">
                        <a href="/forgot-password" class="small text-muted text-decoration-none">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm rounded-3">Log In</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Don't have an account? <a href="/signup" class="text-dark fw-bold">Sign Up</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
