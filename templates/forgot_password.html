<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Beauty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-4 text-center">
                <h4 class="fw-bold text-dark mb-1">Find Account</h4>
                <p class="text-muted small mb-3">Enter your username to verify your account</p>

                {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}

                <form action="/forgot-password" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your account email" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm rounded-3">Verify email</button>
                </form>

                <div class="text-center mt-3">
                    <small><a href="/login" class="text-dark">Back to Login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
