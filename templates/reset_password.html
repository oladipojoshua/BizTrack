<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Beauty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <h4 class="fw-bold text-center text-dark mb-1">Set New Password</h4>
                <p class="text-muted text-center small mb-3">Resetting password for: <strong>{{ username }}</strong></p>

                {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}

                <form action="/reset-password" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">New Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter new password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">Update Password</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
