<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">Developer Admin Panel</h4>
        <a href="/" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
    </div>

    <div class="card border-0 shadow-sm p-3">
        <h6 class="fw-bold mb-3">Registered Users</h6>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Business Name</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td>{{ u.id }}</td>
                        <td class="fw-bold">{{ u.business_name }}</td>
                        <td>{{ u.username }}</td>
                        <td>
                            {% if u.is_admin %}
                                <span class="badge bg-warning text-dark">Admin</span>
                            {% else %}
                                <span class="badge bg-secondary">Client</span>
                            {% endif %}
                        </td>
                        <td>
                            {% if not u.is_admin %}
                            <form action="/admin/delete-user/{{ u.id }}" method="POST" onsubmit="return confirm('Are you sure? Deleting this user will purge all their inventory and sales records!');">
                                <button type="submit" class="btn btn-sm btn-danger">Revoke Access & Delete</button>
                            </form>
                            {% else %}
                                <small class="text-muted">Main Admin</small>
                            {% endif %}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
