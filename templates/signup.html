<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Beauty Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-4">
                <h4 class="fw-bold text-center text-dark mb-1">Create Account</h4>
                <p class="text-muted text-center small mb-3">Register your hair/beauty business</p>

                {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}

                <form action="/signup" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Business Name</label>
                        <input type="text" name="business_name" class="form-control" placeholder="e.g. Tife Hair Essentials" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Choose a password" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">Sign Up</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Already have an account? <a href="/login" class="text-dark fw-bold">Log In</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
